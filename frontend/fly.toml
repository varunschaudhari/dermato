# Deploy: flyctl launch --no-deploy (first time, to create the app) then
# flyctl deploy. See ../DEPLOY.md for the full walkthrough.

app = "dermato-app"          # must be globally unique on Fly — rename if taken
primary_region = "iad"       # match the backend's region

[build]

[env]
  # Public HTTPS URL of the backend Fly app (no trailing slash). nginx proxies
  # /api and /uploads here at container start — see nginx.conf.template.
  BACKEND_ORIGIN = "https://dermato-api.fly.dev"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
