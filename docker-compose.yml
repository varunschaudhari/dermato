services:
  mongo:
    image: mongo:7
    volumes:
      - dermato_mongo_data:/data/db
    # No ports published — reachable only from other containers on this
    # compose network, never from the host or the internet.

  backend:
    build: ./backend
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=dermato
      # The public URL people actually load the frontend from — same value
      # for both, since FRONTEND_URL only ever builds links back to the SPA.
      # Override in .env for anything beyond local dev (e.g. the VPS's
      # http://<host>:<FRONTEND_PORT>).
      - CORS_ORIGINS=${PUBLIC_ORIGIN:-http://localhost:3010}
      - FRONTEND_URL=${PUBLIC_ORIGIN:-http://localhost:3010}
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-secret-change-me}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@dermato.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123}
      - ADMIN_PHONE=${ADMIN_PHONE:-9999999999}
      # Leave unset to log reset/reminder emails to the container's logs
      # instead of sending them (see mailer.py) -- fine for local dev.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@dermato.local}
    depends_on:
      - mongo

  frontend:
    # Production build (nginx serving the compiled bundle) — matches what
    # actually deploys. For local iteration, run `npm run dev` directly
    # instead of docker-compose; it's faster and has hot reload.
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3010}:8080"
    environment:
      - BACKEND_ORIGIN=http://backend:8000
    depends_on:
      - backend

volumes:
  dermato_mongo_data:
