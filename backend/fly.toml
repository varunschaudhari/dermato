# Deploy: flyctl launch --no-deploy (first time, to create the app) then
# flyctl deploy. See ../DEPLOY.md for the full walkthrough including secrets.

app = "dermato-api"          # must be globally unique on Fly — rename if taken
primary_region = "iad"       # pick the region closest to your users

[build]

[env]
  MONGO_DB_NAME = "dermato"
  UPLOAD_DIR = "/app/uploads"
  # MONGO_URI, SECRET_KEY, ADMIN_EMAIL, ADMIN_PASSWORD, CORS_ORIGINS, FRONTEND_URL
  # are secrets, not plain env vars — set them with `fly secrets set`, never here.

[[mounts]]
  source = "dermato_uploads"
  destination = "/app/uploads"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false   # keep it warm — a cold-started ML model load is slow
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.http_checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
